<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <title>Azzo Agenda offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(440px, 100%);
        border: 1px solid #dbe3ef;
        border-radius: 12px;
        background: #ffffff;
        padding: 28px;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.25rem;
      }
      p {
        margin: 0;
        color: #64748b;
        line-height: 1.55;
      }
      button {
        margin-top: 22px;
        border: 0;
        border-radius: 10px;
        background: #2563eb;
        color: #fff;
        padding: 10px 14px;
        font-weight: 700;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #09090b;
          color: #f4f4f5;
        }
        main {
          border-color: #27272a;
          background: #18181b;
        }
        p {
          color: #a1a1aa;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sem conexao no momento</h1>
      <p>O Azzo Agenda carregou o modo offline. Verifique sua internet e tente atualizar a pagina.</p>
      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
