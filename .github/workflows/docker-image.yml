name: Build, Test and Push (frontend)

on:
  push:
    branches:
      - develop
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - develop
      - master

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm precisa estar disponivel ANTES do setup-node para o cache: pnpm
      # conseguir localizar o store. Versao travada igual ao packageManager do
      # package.json e ao Dockerfile.
      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Gate: teste vermelho bloqueia o push da imagem (nao publica build quebrado).
      - name: Testes unitarios (falha imediata em erro)
        run: pnpm test:run

      - name: Login no GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados da imagem
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      # A build de producao (pnpm build) roda DENTRO do Dockerfile multi-stage,
      # com os VITE_* embutidos no bundle a partir dos defaults de producao.
      - name: Build e Push da imagem
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
