server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: rotas do client caem no index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Assets com hash (Vite): cache longo e imutavel
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Service worker e manifest da PWA: nunca em cache (precisam ser vistos a
  # cada deploy para o app detectar atualizacao).
  location = /sw.js {
    add_header Cache-Control "no-store";
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-store";
  }
  location = /version.json {
    add_header Cache-Control "no-store";
  }
  location = /env-config.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
    try_files $uri =404;
 }

  # Headers de seguranca basicos
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
